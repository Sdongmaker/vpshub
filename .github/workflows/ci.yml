name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check examples/dynamic-plugin/host.js
          node --check examples/dynamic-plugin/client.js
      - name: Smoke test (tool registration on fake ctx)
        run: node examples/smoke.mjs
        env:
          # smoke talks to the real ledger if present; on CI there is none,
          # which exercises the fresh-ledger path
          DSH_HOME: /tmp/dsh-ci-home
